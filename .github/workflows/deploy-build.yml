name: Deploy Body Counter Build

on:
  push:
    branches:
      - main
    paths:
      - "builds/*.zip"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: body-counter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Find newest build
        id: build
        run: |
          BUILD=$(ls -t builds/*.zip | head -n 1)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Using build: $BUILD"

      - name: Prepare build
        run: |
          rm -rf /tmp/body-counter-build
          mkdir -p /tmp/body-counter-build
          unzip -q "${{ steps.build.outputs.build }}" -d /tmp/body-counter-build

          test -f /tmp/body-counter-build/index.html
          test -f /tmp/body-counter-build/app.js
          test -f /tmp/body-counter-build/sw.js

      - name: Check JavaScript
        run: |
          node --check /tmp/body-counter-build/app.js
          node --check /tmp/body-counter-build/sw.js

      - name: Update repository
        run: |
          find . -maxdepth 1 -type f -delete
          find . -maxdepth 1 -type d \
            ! -name . \
            ! -name .git \
            ! -name .github \
            ! -name builds \
            -exec rm -rf {} +

          cp -a /tmp/body-counter-build/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes."
          else
            git commit -m "Deploy Body Counter build"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/body-counter-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
